name: Verify old compilers on macOS arm64
on:
  pull_request:
jobs:
  test:
    name: ${{ matrix.version }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        version: [alpha3-rolling, alpha4-rolling, nightly]
        runner: [macos-latest, macos-15]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./
        with:
          version: ${{ matrix.version }}
      - run: curl -fsSL -o main.roc https://raw.githubusercontent.com/roc-lang/examples/75ccb5718653b903330ede4063710cfba80e5c40/examples/HelloWorld/main.roc
      - run: roc main.roc
