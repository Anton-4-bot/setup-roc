name: Test Action

on:
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.version }}${{ matrix.nightly-tag && format(' ({0})', matrix.nightly-tag) || '' }} on ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: Linux
            arch: x86_64
            runner: ubuntu-latest
            version: alpha3-rolling
          - os: Linux
            arch: x86_64
            runner: ubuntu-latest
            version: alpha4-rolling
          - os: Linux
            arch: x86_64
            runner: ubuntu-latest
            version: nightly
          - os: Linux
            arch: x86_64
            runner: ubuntu-latest
            version: nightly-new-compiler
          - os: Linux
            arch: x86_64
            runner: ubuntu-latest
            version: nightly-new-compiler
            nightly-tag: nightly-2026-June-27-127861d
          - os: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            version: alpha3-rolling
          - os: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            version: alpha4-rolling
          - os: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            version: nightly
          - os: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            version: nightly-new-compiler
          - os: macOS
            arch: x86_64
            runner: macos-15-intel
            version: alpha3-rolling
          - os: macOS
            arch: x86_64
            runner: macos-15-intel
            version: alpha4-rolling
          - os: macOS
            arch: x86_64
            runner: macos-15-intel
            version: nightly
          - os: macOS
            arch: x86_64
            runner: macos-15-intel
            version: nightly-new-compiler
          - os: macOS
            arch: arm64
            runner: macos-latest
            version: alpha3-rolling
          - os: macOS
            arch: arm64
            runner: macos-latest
            version: alpha4-rolling
          - os: macOS
            arch: arm64
            runner: macos-latest
            version: nightly
          - os: macOS
            arch: arm64
            runner: macos-latest
            version: nightly-new-compiler
          - os: macOS
            arch: x86_64
            runner: macos-26-intel
            version: nightly-new-compiler
          - os: macOS
            arch: arm64
            runner: macos-26
            version: nightly-new-compiler
          - os: Windows
            arch: x86_64
            runner: windows-2022
            version: nightly-new-compiler
          - os: Windows
            arch: x86_64
            runner: windows-2025
            version: nightly-new-compiler

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Roc
        uses: ./
        with:
          version: ${{ matrix.version }}
          nightly-tag: ${{ matrix.nightly-tag }}
          cache-key-suffix: ${{ matrix.runner }}-${{ matrix.nightly-tag }}

      - name: Check Roc version
        run: roc version

      # Pinned to the last version before the examples moved to new-compiler syntax.
      - name: Download HelloWorld example (old compiler)
        if: matrix.version != 'nightly-new-compiler'
        run: curl -fsSL -o main.roc https://raw.githubusercontent.com/roc-lang/examples/75ccb5718653b903330ede4063710cfba80e5c40/examples/HelloWorld/main.roc

      - name: Download HelloWorld example (new compiler)
        if: matrix.version == 'nightly-new-compiler'
        run: curl -fsSL -o main.roc https://raw.githubusercontent.com/roc-lang/nightlies/main/hello_world_test.roc

      - name: Run HelloWorld example
        run: roc main.roc

  # Jobs run one after another: `save` fills the cache, `restore` must then
  # restore it with an exact key match and `roc test` must report `(cached)`.
  cache:
    name: Cache ${{ matrix.step }} on ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - { os: Linux, runner: ubuntu-latest, step: save }
          - { os: Linux, runner: ubuntu-latest, step: restore }
          - { os: macOS, runner: macos-latest, step: save }
          - { os: macOS, runner: macos-latest, step: restore }
          - { os: Windows, runner: windows-2025, step: save }
          - { os: Windows, runner: windows-2025, step: restore }

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Roc
        id: setup-roc
        uses: ./
        with:
          version: nightly-new-compiler
          cache-key-suffix: ${{ matrix.runner }}

      - name: Run roc test
        shell: bash
        run: |
          printf 'CacheSmoke := [A].{\n\tvalue : I64\n\tvalue = 5\n}\n\nexpect CacheSmoke.value == 5\n' > CacheSmoke.roc
          roc test CacheSmoke.roc | tee test-output.txt

      - name: Check that roc wrote to the cache
        if: matrix.step == 'save'
        shell: bash
        run: |
          echo "ROC_CACHE_DIR=$ROC_CACHE_DIR"
          [[ -n "$(ls -A "$ROC_CACHE_DIR")" ]] || { echo "Error: roc test did not write to ROC_CACHE_DIR"; exit 1; }

      - name: Check that the cache was restored and used
        if: matrix.step == 'restore'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup-roc.outputs.cache-hit }}
        run: |
          [[ "$CACHE_HIT" == "true" ]] || { echo "Error: expected an exact cache hit (cache-hit='$CACHE_HIT')"; exit 1; }
          grep -q "(cached)" test-output.txt || { echo "Error: roc test did not use the restored cache"; exit 1; }

      # Save even when an earlier step failed; the automatic save only runs on success.
      - name: Save Roc cache
        if: always() && steps.setup-roc.outputs.cache-key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-roc.outputs.cache-path }}
          key: ${{ steps.setup-roc.outputs.cache-key }}
