name: 'Setup Roc'
description: 'Download and setup the Roc compiler.'
branding:
  icon: 'download'
  color: 'purple'

inputs:
  version:
    description: 'Version of Roc to install (e.g., "nightly", "nightly-new-compiler", "alpha4-rolling")'
    required: true
  nightly-tag:
    description: 'Pin to a specific nightly release tag from roc-lang/nightlies (e.g., "nightly-2026-June-27-127861d"). Only valid when version is "nightly-new-compiler". When unset, the latest nightly is used.'
    required: false
    default: ''
  token:
    description: 'GitHub token used to authenticate API requests (avoids rate limiting). Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}
  cache:
    description: 'Restore and save the Roc cache (including `roc test` results) with actions/cache. Only applies to "nightly-new-compiler". Set to "false" to disable.'
    required: false
    default: 'true'
  cache-key-suffix:
    description: 'Extra text for the cache key. Use it to keep cache entries apart when jobs share a name, e.g. matrix jobs.'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'Whether the Roc cache was restored with an exact key match. Empty when caching is disabled.'
    value: ${{ steps.roc-cache.outputs.cache-hit }}
  cache-path:
    description: 'Directory of the Roc cache (ROC_CACHE_DIR). Empty when caching is disabled. Use it with actions/cache/save to also save the cache when the job fails.'
    value: ${{ steps.roc-cache-config.outputs.dir }}
  cache-key:
    description: 'Key under which the Roc cache is saved. Empty when caching is disabled. Use it with actions/cache/save to also save the cache when the job fails.'
    value: ${{ steps.roc-cache-config.outputs.key }}

runs:
  using: 'composite'
  steps:
    - name: Download and verify Roc
      shell: bash
      run: |
        set -euo pipefail

        VERSION="${{ inputs.version }}"
        NIGHTLY_TAG="${{ inputs.nightly-tag }}"
        TOKEN="${{ inputs.token }}"
        echo "Installing Roc version: $VERSION"

        # The nightly-tag input only applies to nightly-new-compiler
        if [[ -n "$NIGHTLY_TAG" && "$VERSION" != "nightly-new-compiler" ]]; then
          echo "Error: 'nightly-tag' is only supported when version is 'nightly-new-compiler' (got version '$VERSION')"
          exit 1
        fi

        # Detect OS and architecture
        OS=$(uname -s)
        ARCH=$(uname -m)

        echo "Detected OS: $OS"
        echo "Detected architecture: $ARCH"

        # Archive extension (most platforms ship .tar.gz, Windows ships .zip)
        ASSET_EXT="tar.gz"

        # Determine platform-specific values
        case "$OS" in
          Linux)
            case "$ARCH" in
              x86_64)
                PLATFORM="linux_x86_64"
                DIR_PATTERN="roc_nightly-linux_x86_64-*"
                SHA_CMD="sha256sum"
                ;;
              aarch64|arm64)
                PLATFORM="linux_arm64"
                DIR_PATTERN="roc_nightly-linux_arm64-*"
                SHA_CMD="sha256sum"
                ;;
              *)
                echo "Error: Unsupported Linux architecture: $ARCH"
                exit 1
                ;;
            esac
            ;;
          Darwin)
            case "$ARCH" in
              x86_64)
                PLATFORM="macos_x86_64"
                DIR_PATTERN="roc_nightly-macos_x86_64-*"
                SHA_CMD="shasum -a 256"
                ;;
              arm64)
                PLATFORM="macos_apple_silicon"
                DIR_PATTERN="roc_nightly-macos_apple_silicon-*"
                SHA_CMD="shasum -a 256"
                ;;
              *)
                echo "Error: Unsupported macOS architecture: $ARCH"
                exit 1
                ;;
            esac
            ;;
          MINGW*|MSYS*|CYGWIN*)
            if [[ "$VERSION" != "nightly-new-compiler" ]]; then
              echo "Error: Windows is only supported for the 'nightly-new-compiler' version"
              exit 1
            fi
            case "$ARCH" in
              x86_64)
                PLATFORM="windows_x86_64"
                DIR_PATTERN="roc_nightly-windows_x86_64-*"
                SHA_CMD="sha256sum"
                ASSET_EXT="zip"
                ;;
              *)
                echo "Error: Unsupported Windows architecture: $ARCH"
                exit 1
                ;;
            esac
            ;;
          *)
            echo "Error: Unsupported operating system: $OS"
            exit 1
            ;;
        esac

        # Set expected SHA256 based on version and platform
        case "$VERSION-$PLATFORM" in
          alpha3-rolling-linux_x86_64)
            EXPECTED_SHA="c96045f1f54dc3d9e20c33ede8698d79b01e43f09652795beb4f0bc7fb38cba8"
            ;;
          alpha3-rolling-linux_arm64)
            EXPECTED_SHA="3eaf492e5e11d39a1c5a549005589405c40902fc0bed517acf8e8a18d190a409"
            ;;
          alpha3-rolling-macos_x86_64)
            EXPECTED_SHA="205c70d1f6f6f46c2c681350a68cd91886bdb7a24fd09646f3ba5c2b1e1e1379"
            ;;
          alpha3-rolling-macos_apple_silicon)
            EXPECTED_SHA="ef64605d0be3296ad25e34b2d6841ed506ded6208565cbd4289bc81c9dbd3c9d"
            ;;
          alpha4-rolling-linux_x86_64)
            EXPECTED_SHA="96e8be05e6f7176433ada74532ff36a62b8dc44c5247a82cdf919f2dadc5178b"
            ;;
          alpha4-rolling-linux_arm64)
            EXPECTED_SHA="95558e2b5564b9f2b19fb29ad7df440d4ef7163dea571ffcd39409ef678ecccf"
            ;;
          alpha4-rolling-macos_x86_64)
            EXPECTED_SHA="e8378bdec9fbeaf8f7bae49159a7b43d42050b047375521799984311dcda7078"
            ;;
          alpha4-rolling-macos_apple_silicon)
            EXPECTED_SHA="416fbd983280eda11ac87b0947e27bf0a86d186a94baebeb71e163942bb5bd84"
            ;;
          nightly-new-compiler-*)
            # New compiler nightly builds - no SHA verification
            ;;
          nightly-*)
            # Nightly builds - no SHA verification
            ;;
          *)
            echo "Error: Unsupported version: $VERSION"
            echo "Supported versions: nightly, nightly-new-compiler, alpha3-rolling, alpha4-rolling"
            echo "Make sure your version is listed in https://github.com/roc-lang/roc/tags and try updating to"
            echo "the latest commit of the setup-roc action, see <https://github.com/roc-lang/setup-roc>."
            exit 1
            ;;
        esac

        # Download Roc
        if [[ "$VERSION" == "nightly-new-compiler" ]]; then
          # Fetch a release from roc-lang/nightlies and find the asset for our platform
          AUTH_HEADER=()
          if [[ -n "$TOKEN" ]]; then
            AUTH_HEADER=(-H "Authorization: Bearer $TOKEN")
          fi
          if [[ -n "$NIGHTLY_TAG" ]]; then
            # Pin to a specific, immutable nightly release tag
            echo "Pinning to nightly tag: $NIGHTLY_TAG"
            RELEASE_API_URL="https://api.github.com/repos/roc-lang/nightlies/releases/tags/${NIGHTLY_TAG}"
          else
            RELEASE_API_URL="https://api.github.com/repos/roc-lang/nightlies/releases/latest"
          fi
          DOWNLOAD_URL=$(curl -fsSL "${AUTH_HEADER[@]}" "$RELEASE_API_URL" | \
            jq -r ".assets[] | select(.name | contains(\"${PLATFORM}\")) | select(.name | endswith(\".${ASSET_EXT}\")) | .browser_download_url")
          if [[ -z "$DOWNLOAD_URL" ]]; then
            if [[ -n "$NIGHTLY_TAG" ]]; then
              echo "Error: Could not find a nightly-new-compiler release for platform '$PLATFORM' under tag '$NIGHTLY_TAG'"
              echo "Make sure the tag exists at https://github.com/roc-lang/nightlies/releases and has an asset for your platform."
            else
              echo "Error: Could not find a nightly-new-compiler release for platform: $PLATFORM"
            fi
            exit 1
          fi
          SKIP_SHA_CHECK=true
          DIR_PATTERN="roc_nightly-${PLATFORM}-*"
        elif [[ "$VERSION" == "nightly" ]]; then
          DOWNLOAD_URL="https://github.com/roc-lang/roc/releases/download/nightly/roc_nightly-${PLATFORM}-latest.tar.gz"
          SKIP_SHA_CHECK=true
          DIR_PATTERN="roc_nightly-${PLATFORM}-*"
        else
          DOWNLOAD_URL="https://github.com/roc-lang/roc/releases/download/${VERSION}/roc-${PLATFORM}-${VERSION}.tar.gz"
          SKIP_SHA_CHECK=false
        fi

        echo "Downloading Roc for $PLATFORM..."
        ARCHIVE="roc.${ASSET_EXT}"
        curl -fsSL -o "$ARCHIVE" "$DOWNLOAD_URL"

        # Verify SHA256 checksum (skip for nightly releases)
        if [[ "$SKIP_SHA_CHECK" == "false" ]]; then
          echo "Verifying SHA256 checksum..."
          ACTUAL_SHA=$($SHA_CMD "$ARCHIVE" | awk '{print $1}')

          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Error: SHA256 checksum mismatch!"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $ACTUAL_SHA"
            echo "This should never happen and could mean the file is malicious. Please make a post on <https://roc.zulipchat.com> and request investigation of this incident."
            exit 1
          fi

          echo "SHA256 checksum verified successfully"
        else
          echo "Skipping SHA256 verification for nightly release"
        fi

        # Extract Roc
        echo "Extracting Roc..."
        if [[ "$ASSET_EXT" == "zip" ]]; then
          unzip -q "$ARCHIVE"
        else
          tar -xzf "$ARCHIVE"
        fi
        rm "$ARCHIVE"

        # Find the extracted directory and add to PATH
        ROC_DIR=$(find . -maxdepth 1 -type d -name "$DIR_PATTERN" | head -n 1)
        if [[ -z "$ROC_DIR" ]]; then
          echo "Error: Could not find extracted Roc directory"
          exit 1
        fi

        ROC_INSTALL_DIR="$GITHUB_WORKSPACE/$ROC_DIR"
        echo "$ROC_INSTALL_DIR" >> "$GITHUB_PATH"

        # New-compiler nightlies may include generated glue specs that match
        # the installed compiler. Expose stable paths for downstream platform CI.
        if [[ -d "$ROC_INSTALL_DIR/glue" ]]; then
          echo "ROC_GLUE_DIR=$ROC_INSTALL_DIR/glue" >> "$GITHUB_ENV"

          if [[ -f "$ROC_INSTALL_DIR/glue/RustGlue.roc" ]]; then
            echo "ROC_RUST_GLUE=$ROC_INSTALL_DIR/glue/RustGlue.roc" >> "$GITHUB_ENV"
          fi
          if [[ -f "$ROC_INSTALL_DIR/glue/ZigGlue.roc" ]]; then
            echo "ROC_ZIG_GLUE=$ROC_INSTALL_DIR/glue/ZigGlue.roc" >> "$GITHUB_ENV"
          fi
          if [[ -f "$ROC_INSTALL_DIR/glue/CGlue.roc" ]]; then
            echo "ROC_C_GLUE=$ROC_INSTALL_DIR/glue/CGlue.roc" >> "$GITHUB_ENV"
          fi

          if [[ -f "$ROC_INSTALL_DIR/glue/env" ]]; then
            while IFS='=' read -r name value; do
              case "$name" in
                ROC_GLUE_PLATFORM_URL|ROC_GLUE_PLATFORM_PACKAGE)
                  echo "$name=$value" >> "$GITHUB_ENV"
                  ;;
              esac
            done < "$ROC_INSTALL_DIR/glue/env"
          fi
        fi

        echo "Roc setup completed successfully"

    - name: Configure Roc cache
      id: roc-cache-config
      if: inputs.cache == 'true' && inputs.version == 'nightly-new-compiler'
      shell: bash
      env:
        CACHE_KEY_SUFFIX: ${{ inputs.cache-key-suffix }}
      run: |
        set -euo pipefail

        # Keep a ROC_CACHE_DIR the user already set. Otherwise pin a stable
        # location: the cache only hits when restored to the path it was saved from.
        if [[ -z "${ROC_CACHE_DIR:-}" ]]; then
          ROC_CACHE_DIR="$RUNNER_TEMP/roc-cache"
          echo "ROC_CACHE_DIR=$ROC_CACHE_DIR" >> "$GITHUB_ENV"
        fi
        echo "dir=$ROC_CACHE_DIR" >> "$GITHUB_OUTPUT"

        # Roc keys its own entries by compiler content, so a nightly with the same
        # compiler can reuse an older cache. Restore prefers the same version and
        # falls back to any version. `+` never occurs in the sanitized fields.
        ROC_VERSION=$(roc version)
        ROC_VERSION=$(printf '%s' "${ROC_VERSION##* }" | tr -c 'A-Za-z0-9._-' '-')
        SUFFIX=$(printf '%s' "$CACHE_KEY_SUFFIX" | tr -c 'A-Za-z0-9._-' '-')
        ANY_VERSION="roc-cache-$RUNNER_OS-$RUNNER_ARCH-$GITHUB_JOB+$SUFFIX+"
        SAME_VERSION="$ANY_VERSION$ROC_VERSION+"
        echo "any-version-prefix=$ANY_VERSION" >> "$GITHUB_OUTPUT"
        echo "same-version-prefix=$SAME_VERSION" >> "$GITHUB_OUTPUT"
        echo "key=$SAME_VERSION$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

    # actions/cache saves in a post step when the job succeeds, so no extra step is needed.
    - name: Cache Roc
      id: roc-cache
      if: steps.roc-cache-config.outcome == 'success'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.roc-cache-config.outputs.dir }}
        key: ${{ steps.roc-cache-config.outputs.key }}
        restore-keys: |
          ${{ steps.roc-cache-config.outputs.same-version-prefix }}
          ${{ steps.roc-cache-config.outputs.any-version-prefix }}
