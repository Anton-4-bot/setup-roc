name: Verify fallback
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        tag: [nightly-2026-10-28-bad769b, nightly-2026-10-29-a0a9fc2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - id: setup-roc
        uses: ./
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ matrix.tag }}
          cache-key-suffix: fallback
      - run: |
          roc version
          echo "cache-hit='${{ steps.setup-roc.outputs.cache-hit }}'"
          echo "key=${{ steps.setup-roc.outputs.cache-key }}"
          ls -la "$ROC_CACHE_DIR" || true
          mkdir -p "$ROC_CACHE_DIR"
          echo "from ${{ matrix.tag }}" > "$ROC_CACHE_DIR/marker-${{ matrix.tag }}"
